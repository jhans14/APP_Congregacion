<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Gestor Congregación</title>
    
    <!-- PWA y Metadatos de Aplicación -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Congregación">
    <meta name="description" content="Gestión integral de congregación: asignaciones, territorios, asistencia y publicadores.">
    <link rel="apple-touch-icon" href="icons/icon-apple-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">

    <!-- Estilos Oficiales del Sistema de Diseño V2 -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app" id="appRoot">
        <!-- Mobile Drawer Overlay -->
        <button class="drawer-overlay" id="drawerOverlay" aria-label="Cerrar menú" onclick="toggleSidebarDrawer(false)"></button>

        <!-- Sidebar Lateral V2 -->
        <aside class="sidebar" id="appSidebar">
            <div class="brand">
                <div class="brand-mark">
                    <span></span><span></span><span></span>
                </div>
                <div>
                    <strong>Gestor</strong>
                    <small>CONGREGACIÓN</small>
                </div>
                <button class="btn btn-icon close-drawer" onclick="toggleSidebarDrawer(false)" aria-label="Cerrar menú">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
                </button>
            </div>

            <div class="congregation" onclick="cargarModulo('configuracion')" role="button" title="Configuración de la congregación">
                <span class="avatar" id="sidebarCongregationAvatar">PC</span>
                <div>
                    <strong id="sidebarNombreCongregacion">Paraíso</strong>
                    <small id="sidebarCiudadCongregacion">Carabayllo</small>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </div>

            <nav id="appNav">
                <button class="nav-item active" id="nav-item-inicio" onclick="cargarModulo('inicio')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>
                    <span>Inicio</span>
                    <i class="nav-dot"></i>
                </button>
                <button class="nav-item" id="nav-item-asignaciones" onclick="cargarModulo('asignaciones')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
                    <span>Asignaciones</span>
                </button>
                <button class="nav-item" id="nav-item-territorios" onclick="cargarModulo('territorios')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15M15 6v15"/></svg>
                    <span>Territorios</span>
                </button>
                <button class="nav-item" id="nav-item-asistencia" onclick="cargarModulo('asistencia')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <span>Asistencia</span>
                </button>
                <button class="nav-item" id="nav-item-informes" onclick="cargarModulo('informes')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-8M22 19V3"/><path d="M2 21h22"/></svg>
                    <span>Informes de servicio</span>
                </button>
                <button class="nav-item" id="nav-item-directorio" onclick="cargarModulo('directorio')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
                    <span>Database</span>
                </button>
                <button class="nav-item" id="nav-item-configuracion" onclick="cargarModulo('configuracion')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.94 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88L4.2 7.06 7.03 4.2l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.08V3h4v.08A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.2.6.78 1 1.52 1H21v4h-.08c-.73 0-1.32.4-1.52 1Z"/></svg>
                    <span>Configuración</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="sync-status">
                    <span class="sync-dot"></span>
                    <div>
                        <strong>Datos sincronizados</strong>
                        <small id="syncTimeStatus">Modo local PWA activo</small>
                    </div>
                </div>
                <div class="profile">
                    <span class="avatar avatar-photo">JC</span>
                    <div>
                        <strong>Jhans Crispín</strong>
                        <small>Administrador</small>
                    </div>
                    <button aria-label="Configuración del perfil" onclick="cargarModulo('configuracion')">•••</button>
                </div>
            </div>
        </aside>

        <!-- Main Content Shell -->
        <div class="app-main">
            <header class="topbar">
                <button class="btn btn-icon menu-button" onclick="toggleSidebarDrawer(true)" aria-label="Abrir menú">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>
                <button class="btn btn-icon desktop-sidebar-toggle" onclick="toggleSidebarDesktop()" aria-label="Colapsar panel lateral">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                </button>
                <div class="mobile-brand" onclick="cargarModulo('inicio')">Gestor <span>Congregación</span></div>
                <div class="top-actions">
                    <div class="offline-pill"><span></span> <span id="topOnlineText">En línea</span></div>
                    <button class="btn btn-icon" id="btnThemeToggle" onclick="alternarModoOscuroTop()" aria-label="Cambiar tema">
                        <span id="themeToggleIcon">
                            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
                        </span>
                    </button>
                    <div class="notification-wrap">
                        <button class="btn btn-icon" onclick="toggleNotificationPopover()" aria-label="Notificaciones">
                            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M13.7 21h-3.4"/></svg>
                        </button>
                        <span class="notification-dot" id="topbarNotificationDot"></span>
                        <div class="notification-popover" id="notificationPopover" style="display: none;">
                            <strong>Notificaciones</strong>
                            <div id="notificationPopoverList"></div>
                        </div>
                    </div>
                </div>
            </header>

            <main id="appMainContent">
                <!-- Se inyecta dinámicamente con la lógica real -->
            </main>
        </div>
    </div>

    <!-- Modal Dinámico Personalizado V2 -->
    <div id="modalOverlayCustom" class="modal-overlay" onclick="cerrarModalCustom(event)">
        <div class="modal-card" id="modalCardCustom" onclick="event.stopPropagation()"></div>
    </div>

    <!-- Toast flotante V2 -->
    <div id="toastFloating" class="toast-floating"></div>

    <!-- Scripts de Terceros y Lógica de Negocio -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.1/dist/xlsx.full.min.js" defer></script>
    <script src="js/db.js"></script>
    <script src="js/hermanos.js"></script>
    <script src="js/ajustes.js"></script>
    <script src="js/informes.js"></script>
    <script src="js/asignaciones.js"></script>
    <script src="js/territorios.js"></script>
    <script src="js/asistencia.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>

    <!-- Registro del Service Worker PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ ServiceWorker registrado correctamente:', reg.scope))
                    .catch(err => console.warn('❌ Error al registrar ServiceWorker:', err));
            });
        }
    </script>
</body>
</html>
